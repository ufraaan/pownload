<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pownload</title>
<style>
  :root {
    --bg: #0e0e11;
    --surface: #17171c;
    --border: #2a2a33;
    --text: #e8e8ee;
    --muted: #8b8b98;
    --accent: #6c8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 16px;
  }
  h1 { font-size: 1.6rem; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  p.sub { color: var(--muted); font-size: 0.9rem; margin-top: -10px; }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #drop {
    border: 2px dashed var(--border);
    border-radius: 10px;
    min-height: 180px;
    padding: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    cursor: text;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    white-space: pre-wrap;
    word-break: break-word;
    overflow-y: auto;
    max-height: 320px;
  }
  #drop:focus, body.dragging #drop {
    border-color: var(--accent);
    background: rgba(108, 140, 255, 0.06);
  }
  body.dragging #drop::after {
    content: "";
  }
  #preview {
    display: none;
    max-width: 100%;
    max-height: 240px;
    border-radius: 8px;
    border: 1px solid var(--border);
    align-self: center;
  }
  .row { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
    outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #222229;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 0.9rem;
    opacity: 0;
    transition: transform 0.25s ease, opacity 0.25s ease;
    pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>
  <h1>pown<span>load</span></h1>
  <p class="sub">Paste anything here — text or screenshot — then hit download.</p>

  <div class="card">
    <div id="drop" tabindex="0" contenteditable="true" data-placeholder=""></div>
    <img id="preview" alt="preview">
    <div class="row">
      <input id="name" type="text" placeholder="filename (optional)" spellcheck="false">
      <button id="dl" disabled>Download</button>
    </div>
  </div>

  <div id="toast"></div>

<script>
const drop = document.getElementById("drop");
const preview = document.getElementById("preview");
const nameInput = document.getElementById("name");
const dlBtn = document.getElementById("dl");
const toast = document.getElementById("toast");

let state = null;

const PLACEHOLDER = "Click here and press Ctrl+V / ⌘V to paste…";
function setPlaceholder() {
  if (!state) drop.textContent = PLACEHOLDER;
}
setPlaceholder();

function toastMsg(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove("show"), 2200);
}

function sanitize(name, fallbackExt) {
  let n = name.trim().replace(/[\\/:*?"<>|]/g, "");
  if (!n) return `pownload.${fallbackExt}`;
  if (!/\.[a-z0-9]{1,8}$/i.test(n)) n += "." + fallbackExt;
  return n;
}

function download() {
  const isImage = state.type === "image";
  const filename = sanitize(nameInput.value, isImage ? "png" : "txt");
  const blob = isImage ? state.blob : new Blob([state.text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 500);
  toastMsg(`Saved ${filename}`);
}

function setImage(blob) {
  state = { type: "image", blob };
  drop.textContent = "";
  preview.src = URL.createObjectURL(blob);
  preview.style.display = "block";
  dlBtn.disabled = false;
  nameInput.focus();
}

function setText(text) {
  state = { type: "text", text };
  drop.textContent = text;
  preview.style.display = "none";
  dlBtn.disabled = false;
}

function clearAll() {
  state = null;
  preview.style.display = "none";
  preview.removeAttribute("src");
  dlBtn.disabled = true;
  drop.textContent = "";
  setPlaceholder();
}

document.addEventListener("paste", (e) => {
  e.preventDefault();
  const items = e.clipboardData?.items || [];
  for (const item of items) {
    if (item.type.startsWith("image/")) {
      setImage(item.getAsFile());
      toastMsg(`Image detected (${item.type})`);
      return;
    }
  }
  const text = e.clipboardData?.getData("text/plain");
  if (text) setText(text);
});

["dragover", "dragenter"].forEach((ev) =>
  document.addEventListener(ev, (e) => { e.preventDefault(); document.body.classList.add("dragging"); })
);
["dragleave", "dragend"].forEach((ev) =>
  document.addEventListener(ev, () => document.body.classList.remove("dragging"))
);
document.addEventListener("drop", (e) => {
  e.preventDefault();
  document.body.classList.remove("dragging");
  const file = e.dataTransfer?.files?.[0];
  if (!file) return;
  if (file.type.startsWith("image/")) {
    setImage(file);
    toastMsg(`Loaded ${file.name}`);
  } else {
    const reader = new FileReader();
    reader.onload = () => setText(reader.result);
    reader.readAsText(file);
  }
});

drop.addEventListener("focus", () => { if (drop.textContent === PLACEHOLDER) drop.textContent = ""; });
drop.addEventListener("blur", setPlaceholder);
drop.addEventListener("input", () => {
  state = { type: "text", text: drop.innerText };
  dlBtn.disabled = false;
});
drop.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    if (state) download();
  }
});

dlBtn.addEventListener("click", () => { if (state) download(); });
nameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") download();
});
</script>
</body>
</html>
